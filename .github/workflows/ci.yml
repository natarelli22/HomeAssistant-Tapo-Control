---
name: 'CI'

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  check-code:
    name: Check Code & Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python syntax
        run: |
          python -m py_compile custom_components/tapo_control/*.py

      - name: Validate JSON files
        run: |
          python -c "import json, glob; [json.load(open(f)) for f in glob.glob('custom_components/**/*.json', recursive=True)]"

  check-hacs:
    name: Check HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  check-hassfest:
    name: Check Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

